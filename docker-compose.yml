services:
  db:
    image: postgres:16-alpine
    container_name: agora-db
    restart: unless-stopped
    # env_file, no `environment` con ${VAR}: la interpolación de Compose da
    # precedencia al entorno del shell sobre el .env, y en esta máquina hay
    # POSTGRES_USER y POSTGRES_PASSWORD definidas a nivel de usuario en Windows.
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - agora-data:/var/lib/postgresql/data
    healthcheck:
      # $$ evita la interpolación de Compose: expande la shell del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agora-data: