<main class="grid gap-espacio-4">
  @if (notFound()) {
    <app-empty title="Este proyecto no existe o no tienes acceso">
      <a appButton variant="secondary" routerLink="/proyectos" emptyAction>Volver a proyectos</a>
    </app-empty>
  } @else {
    <header class="grid gap-espacio-1">
      <!-- El margen negativo compensa el relleno lateral del botón discreto. -->
      <div>
        <a appButton variant="subtle" class="-ml-espacio-4" routerLink="/proyectos">
          <span aria-hidden="true" class="mr-espacio-2">←</span>Proyectos
        </a>
      </div>
      <h1 class="titulo-seccion text-tinta">Conversación</h1>
      @if (project.hasValue()) {
        <p class="secundario text-tinta-media">{{ project.value().title }}</p>
      }
    </header>

    <app-project-tabs [projectId]="projectId()" [isMember]="true" [chatOpen]="true" />

    <app-chat-thread
      [source]="source()"
      [readOnly]="closed()"
      [notice]="closed() ? 'Este proyecto está cerrado. La conversación es de solo lectura.' : null"
      [showComposer]="project.hasValue()"
      [online]="online()"
    />
  }
</main>
