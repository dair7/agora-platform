<main class="p-espacio-6">
  <h1 class="titulo-pagina">Inicio</h1>

  @if (session.user(); as user) {
    <p class="cuerpo mt-espacio-2">
      Sesión iniciada como <span class="cuerpo-fuerte">{{ user.fullName }}</span>
    </p>
    <p class="secundario text-tinta-media">{{ user.email }} · {{ roleLabels[user.systemRole] }}</p>

    <!-- Solo lo ve quien puede entrar: nadie ve un enlace que el guard le negaría. -->
    @if (user.systemRole === 'COORDINATOR') {
      <p class="cuerpo mt-espacio-4">
        <a routerLink="/reportes" class="text-veril underline">Ver reportes</a>
      </p>
    }

    <button
      appButton
      variant="secondary"
      type="button"
      class="mt-espacio-5"
      [disabled]="leaving()"
      (click)="logout()"
    >
      {{ leaving() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
    </button>
  }
</main>
